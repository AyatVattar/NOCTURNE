<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOCTURNE | Product Details</title>

    <link rel="stylesheet" href="../style/home.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css">

</head>

<body>

    <header class="header">

        <nav class="nav container">

            <a href="index.html" class="nav-logo">NOCTURNE</a>

            <div class="nav-actions">

                <a href="index.html" class="nav-link">
                    <i class="ri-arrow-left-line"></i>
                    Back to Collection
                </a>

            </div>

        </nav>

    </header>


    <main class="product-container">

        <div class="product-top">

            <span class="section-label">NOCTURNE COLLECTION</span>

            <button class="back-button">
                <i class="ri-arrow-left-line"></i>
                Back to Products
            </button>

        </div>


        <div class="product-details">

            <div class="product-image-wrapper">

                <span class="product-badge">SELECTED ITEM</span>

                <img
                    src=""
                    alt="Product"
                    class="product-image">

            </div>


            <div class="product-info">

                <span class="product-category">
                    THE DARK EDITION
                </span>

                <h1 class="product-title"></h1>

                <div class="product-price"></div>

                <div class="product-divider"></div>

                <h3>DESCRIPTION</h3>

                <div class="product-description"></div>

                <div class="product-note">
                    <i class="ri-information-line"></i>
                    Product information is provided by the demo API.
                </div>

                <button class="add-to-cart">
                    <i class="ri-shopping-bag-line"></i>
                    Add to Cart
                </button>

            </div>

        </div>


        <div class="product-footer">
            NOCTURNE — ELEGANCE BEYOND THE ORDINARY.
        </div>

    </main>


    <script src="../javascripts/product.js"></script>

</body>
</html>
